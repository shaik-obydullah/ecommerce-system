; PHP runtime configuration for the ecommerce core.
date.timezone = UTC
expose_php = Off
memory_limit = 256M
max_execution_time = 60
post_max_size = 32M
upload_max_filesize = 32M
max_input_vars = 5000

; Opcache: validate timestamps in dev, use a short revalidate window in prod.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Session security defaults (Laravel still controls cookie flags).
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; Log errors to stderr so Docker captures them.
log_errors = On
error_log = /proc/self/fd/2
